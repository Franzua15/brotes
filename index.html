<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d2b">
<title>Brotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Pantalla de inicio -->
<section id="home" class="screen">
  <img class="logo-big" src="assets/logo.webp" alt="Brotes">
  <div class="setup-box">
    <h2>🌐 Jugar online</h2>
    <input id="myName" class="name-input wide" maxlength="14" placeholder="Tu nombre" aria-label="Tu nombre" autocomplete="nickname">
    <button id="createBtn" class="btn big">🌱 Crear sala</button>
    <div class="or"><span>o únete con un código</span></div>
    <div class="join-row">
      <input id="joinCode" class="name-input code-input" maxlength="5" placeholder="CÓDIGO" aria-label="Código de la sala" autocomplete="off" autocapitalize="characters">
      <button id="joinBtn" class="btn">Unirme</button>
    </div>
    <p id="homeError" class="error" hidden></p>
    <div class="row">
      <button class="btn ghost" data-open-guide>📖 Guía</button>
      <button class="btn ghost" id="localBtn">📱 Modo prueba</button>
    </div>
  </div>
</section>

<!-- Modo prueba (un solo móvil) -->
<section id="setup" class="screen" hidden>
  <img class="logo-big" src="assets/logo.webp" alt="Brotes">
  <div class="setup-box">
    <p class="mode">📱 Modo prueba: se juega pasando el móvil</p>
    <h2>¿Cuántos jugadores?</h2>
    <div id="countChips" class="chips"></div>
    <div id="names" class="names"></div>
    <button id="startBtn" class="btn big">🌱 Empezar partida</button>
    <button class="btn ghost" id="backHome">← Volver</button>
  </div>
</section>

<!-- Sala de espera (online) -->
<section id="lobby" class="screen" hidden>
  <img class="logo-mid" src="assets/logo.webp" alt="Brotes">
  <div class="setup-box">
    <p class="mode">Código de la sala</p>
    <div id="lobbyCode" class="big-code"></div>
    <button id="shareBtn" class="btn ghost">📤 Invitar amigos</button>
    <h2 id="lobbyCount"></h2>
    <ul id="lobbyPlayers" class="lobby-players"></ul>
    <button id="lobbyStart" class="btn big">🌱 Empezar partida</button>
    <p id="lobbyWait" class="mode"></p>
    <p id="lobbyError" class="error" hidden></p>
    <button id="lobbyLeave" class="btn ghost small">Salir de la sala</button>
  </div>
</section>

<!-- Partida -->
<section id="game" class="board" hidden>
  <div class="hud-top">
    <span id="roundInfo" class="pill"></span>
    <div id="event" class="event" role="status" aria-live="polite"></div>
    <button class="round-btn" id="charsBtn" aria-label="Habilidades de los personajes">📋</button>
    <button class="round-btn" data-open-guide aria-label="Guía del juego">📖</button>
    <button class="round-btn" id="menuBtn" aria-label="Opciones">⚙️</button>
  </div>

  <div class="center" aria-label="Mazo">
    <div class="deck"><img src="assets/ui/mazo.webp" alt=""><span id="deckCount" class="deck-count"></span></div>
  </div>

  <div id="seats"></div>

  <!-- Zona de abajo: carta de acciones a un lado y tu mano -->
  <div id="bottom" class="bottom">
    <div class="side">
      <div id="actionCard" class="action-card">
        <img src="assets/guia/acciones.webp" alt="Acciones por turno">
        <button type="button" class="ac-row r1" data-act="refrescar" aria-label="Refrescarse: gana 1 gota"></button>
        <button type="button" class="ac-row r2" data-act="ayuda" aria-label="Pedir ayuda a la naturaleza: toma 2 gotas"></button>
        <button type="button" class="ac-row r3" data-act="exterminar" aria-label="Exterminar: paga 8 gotas"></button>
        <button type="button" class="ac-row r4" data-act="habilidad" aria-label="Usar la habilidad de una planta"></button>
      </div>
    </div>
    <div class="mine">
      <div id="me" class="me"></div>
    </div>
  </div>

  <div id="dialog" class="dialog" hidden></div>
  <div id="curtain" class="curtain" hidden></div>
</section>

<!-- Guía deslizable -->
<div id="guide" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <strong>📖 Guía de Brotes</strong>
      <button class="close" data-close aria-label="Cerrar">✕</button>
    </div>
    <div id="guideTabs" class="guide-tabs"></div>
    <div id="slides" class="slides"></div>
    <div class="guide-nav">
      <button class="btn ghost small" id="prevSlide" aria-label="Anterior">◀</button>
      <div id="dots" class="dots"></div>
      <button class="btn ghost small" id="nextSlide" aria-label="Siguiente">▶</button>
    </div>
  </div>
</div>

<!-- Carta en grande -->
<div id="zoom" class="sheet zoom" hidden><img alt=""></div>

<!-- Menú -->
<div id="menu" class="sheet" hidden>
  <div class="sheet-card menu-card">
    <div class="sheet-head"><strong>⚙️ Opciones</strong><button class="close" data-close aria-label="Cerrar">✕</button></div>
    <label class="switch"><input type="checkbox" id="showAll"> 👁️ Ver todas las cartas (solo para probar)</label>
    <details class="log"><summary>📜 Historial de la partida</summary><ol id="log"></ol></details>
    <button class="btn danger" id="newGameBtn">🔄 Nueva partida</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/vendor/supabase-2.57.4.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d2b">
<title>Brotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Pantalla de inicio -->
<section id="setup" class="screen">
  <img class="logo-big" src="assets/logo.webp" alt="Brotes">
  <div class="setup-box">
    <p class="mode">🧪 Modo prueba: todos juegan en esta pantalla</p>
    <h2>¿Cuántos jugadores?</h2>
    <div id="countChips" class="chips"></div>
    <div id="names" class="names"></div>
    <button id="startBtn" class="btn big">🌱 Empezar partida</button>
    <button class="btn ghost" data-open-guide>📖 Ver la guía</button>
  </div>
</section>

<!-- Partida -->
<section id="game" class="screen" hidden>
  <header class="bar">
    <img src="assets/logo.webp" alt="Brotes" class="logo-small">
    <span id="roundInfo" class="round"></span>
    <button class="icon-btn" data-open-guide aria-label="Guía de personajes">📖<span>Guía</span></button>
    <button class="icon-btn" id="menuBtn" aria-label="Menú">⚙️</button>
  </header>
  <div id="event" class="event" role="status" aria-live="polite"></div>
  <main id="table" class="table"></main>
  <section id="panel" class="panel"></section>
</section>

<!-- Guía deslizable -->
<div id="guide" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <strong>📖 Guía de Brotes</strong>
      <button class="close" data-close aria-label="Cerrar">✕</button>
    </div>
    <div id="guideTabs" class="guide-tabs"></div>
    <div id="slides" class="slides"></div>
    <div class="guide-nav">
      <button class="btn ghost small" id="prevSlide" aria-label="Anterior">◀</button>
      <div id="dots" class="dots"></div>
      <button class="btn ghost small" id="nextSlide" aria-label="Siguiente">▶</button>
    </div>
  </div>
</div>

<!-- Carta en grande -->
<div id="zoom" class="sheet zoom" hidden><img alt=""></div>

<!-- Menú -->
<div id="menu" class="sheet" hidden>
  <div class="sheet-card menu-card">
    <div class="sheet-head"><strong>⚙️ Opciones</strong><button class="close" data-close aria-label="Cerrar">✕</button></div>
    <label class="switch"><input type="checkbox" id="showAll"> 👁️ Ver todas las cartas (solo para probar)</label>
    <details class="log"><summary>📜 Historial de la partida</summary><ol id="log"></ol></details>
    <button class="btn danger" id="newGameBtn">🔄 Nueva partida</button>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
